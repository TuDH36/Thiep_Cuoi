<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tạo link mời khách</title>
<style>
  :root{--bg:#F6F5F2;--card:#fff;--ink:#2A2928;--mute:#6F6B67;--line:#DEDBD6;--accent:#C84E4E;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  main{max-width:760px;margin:0 auto;display:grid;gap:18px}
  h1{margin:0;font-size:24px}
  p{margin:0;color:var(--mute)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
  label{font-weight:600;font-size:14px}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg label{display:flex;align-items:center;gap:6px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
  button{border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 15px/1 system-ui,sans-serif;padding:12px 16px;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  li b{display:block}
  li code{display:block;font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Tạo link mời khách</h1>
  <p>Mỗi dòng một tên khách. Bấm Tạo link, rồi bấm Chép cạnh từng khách để dán vào Zalo hoặc Messenger.</p>
  <div class="card">
    <label for="names">Danh sách khách</label>
    <textarea id="names" placeholder="Bác Hùng và gia đình&#10;Anh Tuấn và người thương&#10;Chị Lan"></textarea>
    <div class="seg" role="radiogroup" aria-label="Link của bên nào">
      <label><input type="radio" name="ben" value="nha-trai" checked> Nhà trai gửi</label>
      <label><input type="radio" name="ben" value="nha-gai"> Nhà gái gửi</label>
    </div>
    <div class="row"><button id="make" type="button">Tạo link</button><button id="all" class="ghost" type="button" hidden>Chép tất cả</button></div>
  </div>
  <ul id="out" aria-live="polite"></ul>
</main>
<script>
  const base = location.origin + location.pathname.replace(/tao-link\.html$/, "");
  const out = document.getElementById("out"), allBtn = document.getElementById("all");
  let lines = [];
  const copy = (text, btn) => {
    const done = t => { const o = btn.textContent; btn.textContent = t; setTimeout(() => btn.textContent = o, 1500); };
    navigator.clipboard.writeText(text).then(() => done("Đã chép"), () => { prompt("Chép link này:", text); });
  };
  document.getElementById("make").addEventListener("click", () => {
    const ben = document.querySelector('input[name="ben"]:checked').value;
    const names = document.getElementById("names").value.split("\n").map(s => s.trim()).filter(Boolean);
    out.innerHTML = ""; lines = [];
    names.forEach(n => {
      const url = `${base}?ben=${ben}&to=${encodeURIComponent(n)}`;
      lines.push(`${n}: ${url}`);
      const li = document.createElement("li");
      li.innerHTML = `<div><b></b><code></code></div><button type="button">Chép</button>`;
      li.querySelector("b").textContent = n; li.querySelector("code").textContent = url;
      li.querySelector("button").addEventListener("click", e => copy(url, e.currentTarget));
      out.appendChild(li);
    });
    allBtn.hidden = !names.length;
  });
  allBtn.addEventListener("click", () => copy(lines.join("\n"), allBtn));
</script>
</body>
</html>
